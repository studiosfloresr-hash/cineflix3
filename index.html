<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mantenimiento | CINEFLIX</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: Arial, Helvetica, sans-serif;

      color: #ffffff;

      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(255, 0, 0, 0.25),
          transparent 35%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(255, 255, 255, 0.08),
          transparent 35%
        ),
        #080808;

      overflow: hidden;
    }

    /* ==============================
       FONDO
    ============================== */

    .stars,
    .stars::before,
    .stars::after {
      position: fixed;
      inset: 0;

      content: "";

      pointer-events: none;

      background-image:
        radial-gradient(
          2px 2px at 20% 30%,
          rgba(255,255,255,.85),
          transparent
        ),
        radial-gradient(
          1px 1px at 70% 20%,
          rgba(255,255,255,.75),
          transparent
        ),
        radial-gradient(
          1px 1px at 40% 80%,
          rgba(255,255,255,.65),
          transparent
        ),
        radial-gradient(
          2px 2px at 85% 55%,
          rgba(255,0,0,.85),
          transparent
        ),
        radial-gradient(
          1px 1px at 10% 75%,
          rgba(255,255,255,.7),
          transparent
        );

      background-size: 280px 280px;

      animation:
        estrellas 18s linear infinite;
    }

    .stars::before {
      animation-duration: 28s;
      opacity: .45;
    }

    .stars::after {
      animation-duration: 38s;
      opacity: .25;
    }

    @keyframes estrellas {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(-280px);
      }
    }

    /* ==============================
       TARJETA
    ============================== */

    .card {
      width: min(92%, 720px);

      padding: 55px 30px;

      text-align: center;

      position: relative;

      z-index: 2;

      border-radius: 28px;

      border: 1px solid rgba(255,255,255,.15);

      background: rgba(12,12,12,.90);

      box-shadow:
        0 25px 80px rgba(0,0,0,.75),
        0 0 60px rgba(255,0,0,.13),
        inset 0 1px 0 rgba(255,255,255,.08);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    /* ==============================
       LOGO
    ============================== */

    .logo {
      width: 88px;
      height: 88px;

      margin: 0 auto 25px;

      border-radius: 24px;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 34px;

      font-weight: 900;

      color: #ffffff;

      background:
        linear-gradient(
          135deg,
          #ff0000,
          #a50000
        );

      box-shadow:
        0 0 45px
        rgba(255,0,0,.45);

      animation:
        pulso 2s infinite;
    }

    @keyframes pulso {

      0%,
      100% {
        transform: scale(1);

        box-shadow:
          0 0 25px
          rgba(255,0,0,.35);
      }

      50% {
        transform: scale(1.04);

        box-shadow:
          0 0 55px
          rgba(255,0,0,.75);
      }
    }

    /* ==============================
       BADGE
    ============================== */

    .badge {
      display: inline-block;

      padding: 9px 18px;

      border-radius: 999px;

      font-size: 12px;

      font-weight: 800;

      letter-spacing: 2px;

      color: #ffffff;

      background:
        rgba(255,0,0,.12);

      border:
        1px solid
        rgba(255,0,0,.5);

      margin-bottom: 22px;
    }

    /* ==============================
       TITULO
    ============================== */

    h1 {
      font-size:
        clamp(38px, 9vw, 72px);

      letter-spacing: 3px;

      margin-bottom: 15px;

      color: #ffffff;
    }

    h1 span {
      color: #ff1111;
    }

    /* ==============================
       TEXTO
    ============================== */

    .description {
      color: #d0d0d0;

      font-size: 16px;

      line-height: 1.7;

      max-width: 550px;

      margin: 0 auto;
    }

    /* ==============================
       BARRA
    ============================== */

    .progress-container {
      width:
        min(440px, 88%);

      height: 14px;

      margin:
        35px auto 0;

      padding: 2px;

      background: #1d1d1d;

      border:
        1px solid #444;

      border-radius: 50px;

      overflow: hidden;

      box-shadow:
        0 0 18px
        rgba(255,0,0,.18);
    }

    .progress-bar {
      width: 0%;

      height: 100%;

      border-radius: 50px;

      background:
        linear-gradient(
          90deg,
          #ff0000,
          #ffffff,
          #ff0000
        );

      box-shadow:
        0 0 18px
        rgba(255,0,0,.85);

      transition:
        width 1s linear;
    }

    /* ==============================
       PORCENTAJE
    ============================== */

    .percentage {
      margin-top: 12px;

      color: #ff0000;

      font-size: 22px;

      font-weight: 800;

      letter-spacing: 1px;

      text-shadow:
        0 0 12px
        rgba(255,0,0,.45);
    }

    /* ==============================
       MENSAJE
    ============================== */

    .small {
      margin-top: 20px;

      font-size: 13px;

      color: #888888;

      line-height: 1.6;
    }

    /* ==============================
       FOOTER
    ============================== */

    footer {
      margin-top: 28px;

      color: #555555;

      font-size: 12px;
    }

    footer strong {
      color: #ff0000;
    }

    /* ==============================
       CELULAR
    ============================== */

    @media (max-width: 480px) {

      .card {
        width: 92%;

        padding: 42px 20px;

        border-radius: 22px;
      }

      .logo {
        width: 72px;
        height: 72px;

        font-size: 27px;
      }

      h1 {
        font-size: 42px;
      }

      .description {
        font-size: 15px;
      }

      .progress-container {
        width: 90%;
      }
    }

  </style>
</head>

<body>

  <!-- FONDO -->

  <div class="stars"></div>


  <!-- CONTENIDO -->

  <main class="card">

    <!-- LOGO -->

    <div class="logo">
      CF
    </div>


    <!-- ESTADO -->

    <div class="badge">
      MANTENIMIENTO
    </div>


    <!-- NOMBRE -->

    <h1>
      CINE<span>FLIX</span>
    </h1>


    <!-- MENSAJE -->

    <p class="description">

      Estamos realizando algunas mejoras
      en nuestra plataforma para ofrecerte
      una experiencia más rápida, moderna y segura.

    </p>


    <!-- BARRA DE PROGRESO -->

    <div class="progress-container">

      <div
        class="progress-bar"
        id="progressBar">
      </div>

    </div>


    <!-- PORCENTAJE -->

    <div
      class="percentage"
      id="progressText">

      0%

    </div>


    <!-- MENSAJE INFERIOR -->

    <div class="small">

      Volveremos muy pronto.
      Gracias por tu paciencia.

    </div>


    <!-- FOOTER -->

    <footer>

      © 2026
      <strong>CINEFLIX</strong>
      · Todos los derechos reservados

    </footer>

  </main>


  <script>

    /*
      ======================================
      PERIODO DE MANTENIMIENTO
      ======================================

      Inicio:
      24 de agosto de 2026

      Final:
      24 de septiembre de 2026
    */


    const fechaInicio =
      new Date(
        2026,
        7,
        24,
        0,
        0,
        0
      );


    const fechaFinal =
      new Date(
        2026,
        8,
        24,
        0,
        0,
        0
      );


    /*
      ACTUALIZAR PROGRESO
    */

    function actualizarProgreso() {

      const ahora =
        new Date();


      let progreso = 0;


      /*
        Antes del inicio
      */

      if (
        ahora.getTime() <=
        fechaInicio.getTime()
      ) {

        progreso = 0;

      }


      /*
        Después del final
      */

      else if (
        ahora.getTime() >=
        fechaFinal.getTime()
      ) {

        progreso = 100;

      }


      /*
        Durante el mantenimiento
      */

      else {

        const total =
          fechaFinal.getTime() -
          fechaInicio.getTime();


        const transcurrido =
          ahora.getTime() -
          fechaInicio.getTime();


        progreso =
          (
            transcurrido /
            total
          ) * 100;

      }


      /*
        Mantener entre 0 y 100
      */

      progreso =
        Math.max(
          0,
          Math.min(
            100,
            progreso
          )
        );


      /*
        Porcentaje entero
      */

      const porcentaje =
        Math.floor(progreso);


      /*
        Barra
      */

      document.getElementById(
        "progressBar"
      ).style.width =
        progreso + "%";


      /*
        Texto
      */

      document.getElementById(
        "progressText"
      ).textContent =
        porcentaje + "%";

    }


    /*
      Ejecutar al abrir
    */

    actualizarProgreso();


    /*
      Actualizar cada minuto
    */

    setInterval(
      actualizarProgreso,
      60000
    );

  </script>

</body>
</html>
