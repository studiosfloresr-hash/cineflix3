
<section class="download">
  <h2>Descargar CINEFLIX</h2>
  <p>Descarga la aplicación para tu dispositivo Android.</p>

  <button id="downloadBtn" class="button" onclick="descargarApp()">
    ⬇ DESCARGAR APLICACIÓN
  </button>

  <div id="loading" style="display:none; margin-top:22px;">
    <div class="spinner"></div>
    <p id="loadingText">Preparando descarga...</p>
  </div>
</section>

<style>
  .button {
    display: inline-block;
    margin-top: 12px;
    padding: 15px 25px;
    border: none;
    border-radius: 10px;
    background: #ff304f;
    color: white;
    text-decoration: none;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
  }

  .spinner {
    width: 42px;
    height: 42px;
    margin: 0 auto 12px;
    border: 4px solid #49303a;
    border-top-color: #ff304f;
    border-radius: 50%;
    animation: girar .8s linear infinite;
  }

  @keyframes girar {
    to { transform: rotate(360deg); }
  }
</style>

<script>
  function descargarApp() {
    const boton = document.getElementById("downloadBtn");
    const loading = document.getElementById("loading");
    const texto = document.getElementById("loadingText");

    if (boton.disabled) return;

    boton.disabled = true;
    boton.style.opacity = "0.6";
    boton.textContent = "PROCESANDO...";
    loading.style.display = "block";
    texto.textContent = "Preparando descarga...";

    setTimeout(function () {
      texto.textContent = "Conectando con MediaFire...";

      setTimeout(function () {
        window.location.href =
          "https://www.mediafire.com/file/oi509un5m5bm5dl/Cineflix_v1.4.0(11)_mod.apk/file";
      }, 1200);

    }, 1500);
  }
</script>
