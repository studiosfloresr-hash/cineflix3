
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090f">
  <title>CINEFLIX - Descargar aplicación</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background: #09090f;
    }

    header {
      padding: 20px 12px;
      text-align: center;
      background: #14111b;
    }

    .logo {
      font-size: clamp(25px, 6vw, 34px);
      font-weight: 900;
      letter-spacing: 2px;
    }

    .logo span {
      color: #ff304f;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
      padding: 35px 18px;
    }

    .card {
      padding: clamp(22px, 5vw, 35px);
      text-align: center;
      background: #17131e;
      border: 1px solid #302536;
      border-radius: 22px;
    }

    .app-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 90px;
      height: 90px;
      margin: 0 auto 22px;
      border-radius: 22px;
      background: linear-gradient(145deg, #ff4059, #a90040);
      font-size: 34px;
      font-weight: 900;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(27px, 7vw, 38px);
    }

    p {
      color: #c7bdcf;
      font-size: 15px;
      line-height: 1.65;
    }

    .download-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 54px;
      margin-top: 24px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #ff304f;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .download-btn:disabled {
      opacity: .7;
      cursor: wait;
    }

    .loading {
      display: none;
      margin-top: 25px;
    }

    .spinner {
      width: 43px;
      height: 43px;
      margin: 0 auto 14px;
      border: 4px solid #49303a;
      border-top-color: #ff304f;
      border-radius: 50%;
      animation: girar .8s linear infinite;
    }

    @keyframes girar {
      to { transform: rotate(360deg); }
    }

    .loading p {
      margin: 8px 0;
      font-size: 14px;
    }

    footer {
      padding: 20px 12px;
      text-align: center;
      color: #817789;
      font-size: 12px;
    }

    @media (max-width: 380px) {
      .container {
        padding: 22px 12px;
      }

      .card {
        border-radius: 16px;
        padding: 22px 16px;
      }

      .download-btn {
        font-size: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation-duration: 2s;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">CINE<span>FLIX</span></div>
  </header>

  <main class="container">
    <section class="card">
      <div class="app-icon">CF</div>

      <h1>Descargar CINEFLIX</h1>

      <p>
        Disfruta de CINEFLIX en tu dispositivo Android.
        Pulsa el botón para continuar con la descarga.
      </p>

      <button
        type="button"
        id="downloadBtn"
        class="download-btn"
        onclick="descargarApp()">
        ⬇ DESCARGAR APLICACIÓN
      </button>

      <div
        id="loading"
        class="loading"
        role="status"
        aria-live="polite">
        <div class="spinner"></div>
        <p id="loadingText">Preparando descarga...</p>
        <p>Por favor, espera un momento.</p>
      </div>
    </section>
  </main>

  <footer>
    CINEFLIX · Compatible con dispositivos móviles
  </footer>

  <script>
    let procesando = false;

    function descargarApp() {
      if (procesando) return;
      procesando = true;

      const boton = document.getElementById("downloadBtn");
      const loading = document.getElementById("loading");
      const texto = document.getElementById("loadingText");

      boton.disabled = true;
      boton.textContent = "PROCESANDO...";
      loading.style.display = "block";

      setTimeout(() => {
        texto.textContent = "Conectando con MediaFire...";

        setTimeout(() => {
          window.location.href =
            "https://www.mediafire.com/file/oi509un5m5bm5dl/Cineflix_v1.4.0(11)_mod.apk/file";
        }, 1200);

      }, 1500);
    }
  </script>
</body>
</html>
